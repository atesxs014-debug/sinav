name: APK ve IPA Derle

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Hangi platform
        type: choice
        options: [android, ios, ikisi]
        default: android

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Paketleri kur
        run: npm run kur
      - name: Soru verisini üret
        run: node scripts/build-data.js
      - name: Android projesini oluştur
        run: npx expo prebuild --platform android --non-interactive
      - name: APK derle
        run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: acik-lise-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paketleri kur
        run: npm run kur
      - name: Soru verisini üret
        run: node scripts/build-data.js
      - name: iOS projesini oluştur
        run: npx expo prebuild --platform ios --non-interactive
      - name: İmzasız IPA derle
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WS" -list -json | python3 -c "import sys,json; s=json.load(sys.stdin)['workspace']['schemes']; print([x for x in s if not x.startswith('Pods') and not x.startswith('Expo') and not x.startswith('EX')][0])")
          echo "Scheme: $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr acik-lise.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: acik-lise-ipa
          path: acik-lise.ipa
