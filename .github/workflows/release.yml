name: APK'yı Sürüm Olarak Yayınla

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Derleme çalışmasının numarası
        required: true

permissions:
  contents: write
  actions: read

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: acik-lise-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sürüm oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv app-release.apk acik-lise.apk
          TAG="v1.0.${{ inputs.run_id }}"
          gh release create "$TAG" acik-lise.apk -R "${{ github.repository }}" --title "Açık Lise Hazırlık $TAG" --notes "Android APK"
