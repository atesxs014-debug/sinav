<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=4, user-scalable=yes">
<title>Açık Lise Çıkmış Sorular</title>
<style>
/* Eski Android WebView'larla uyumlu: CSS değişkeni, grid ve flex-gap yok; renkler sabit. */
* { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
html, body { margin: 0; padding: 0; }
body { background: #F4F5F7; color: #18233A; font-family: Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.35; }
body.testte { padding-bottom: 132px; }
body.secimde { padding-bottom: 84px; }
.kabuk { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; }
button { font-family: inherit; font-size: inherit; color: inherit; border: 0; background: none; margin: 0; padding: 0; cursor: pointer; }
.tik { cursor: pointer; }
.ara { margin-bottom: 12px; }
.ust { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; min-height: 44px; margin-bottom: 12px; }
.geri { width: 40px; height: 40px; font-size: 30px; line-height: 36px; color: #1F3A6B; text-align: left; -webkit-flex: none; flex: none; }
.ust-yazi { -webkit-flex: 1; flex: 1; min-width: 0; }
.ust h1 { font-size: 19px; margin: 0; font-weight: 800; }
.ust small { display: block; color: #5E6778; font-size: 13px; font-weight: 500; margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.etiket { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #5E6778; font-weight: 700; }
.dev { font-size: 28px; line-height: 1.15; margin: 4px 0 10px; font-weight: 800; }
.bilgi { color: #5E6778; line-height: 1.5; margin: 0 0 14px; }
.ozet { display: -webkit-box; display: -webkit-flex; display: flex; background: #fff; border: 1px solid #DDE1E8; border-radius: 14px; margin-bottom: 12px; }
.oz { -webkit-flex: 1; flex: 1; padding: 14px 6px; text-align: center; }
.oz + .oz { border-left: 1px solid #DDE1E8; }
.oz b { display: block; font-size: 22px; }
.oz span { font-size: 12px; color: #5E6778; }
.ikili { display: -webkit-box; display: -webkit-flex; display: flex; }
.ikili > * { -webkit-flex: 1; flex: 1; min-width: 0; }
.ikili > * + * { margin-left: 10px; }
.bant { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: #FBE4E4; color: #C93535; border-radius: 12px; padding: 14px; font-weight: 700; margin-bottom: 12px; }
.bant .ic { -webkit-flex: 1; flex: 1; }
h2 { font-size: 15px; margin: 18px 0 8px; font-weight: 800; }
.satir { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: #fff; border: 1px solid #DDE1E8; border-radius: 12px; padding: 14px; margin-bottom: 8px; }
.satir:active { border-color: #1F3A6B; background: #F8FAFD; }
.satir .ic { -webkit-flex: 1; flex: 1; min-width: 0; margin-right: 10px; }
.ad { font-weight: 700; font-size: 15px; }
.alt { color: #5E6778; font-size: 13px; margin-top: 3px; }
.kod { display: inline-block; font-size: 12px; font-weight: 800; color: #1F3A6B; background: #E6ECF6; border-radius: 6px; padding: 2px 7px; margin-right: 6px; }
.cubuk { height: 6px; border-radius: 3px; background: #DDE1E8; overflow: hidden; margin-top: 8px; }
.cubuk i { display: block; height: 6px; background: #1F3A6B; }
.sayac { color: #5E6778; font-size: 13px; font-weight: 600; white-space: nowrap; }
.rozet { padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 13px; background: #E6ECF6; color: #1F3A6B; white-space: nowrap; }
.rozet.iyi { background: #E2F3E9; color: #1E8A50; }
.rozet.kotu { background: #FBE4E4; color: #C93535; }
.btn { display: block; width: 100%; border-radius: 12px; padding: 13px; font-weight: 800; background: #1F3A6B; color: #fff; text-align: center; border: 2px solid #1F3A6B; }
.btn.cizgi { background: transparent; color: #1F3A6B; }
.btn.yesil { background: #1E8A50; border-color: #1E8A50; }
.btn.kirmizi { background: #C93535; border-color: #C93535; }
.btn.kapali { opacity: .4; }
.baglanti { display: block; width: 100%; color: #1F3A6B; font-weight: 700; padding: 12px; text-align: center; }
.baglanti.sil { color: #C93535; }
/* ders seçimi */
.adim { font-size: 13px; color: #5E6778; font-weight: 700; margin-bottom: 4px; }
.secenek { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: #fff; border: 2px solid #DDE1E8; border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; }
.secenek .kutu { -webkit-flex: none; flex: none; width: 24px; height: 24px; border-radius: 6px; border: 2px solid #9AA3B4; margin-right: 12px; color: #fff; font-weight: 900; text-align: center; line-height: 20px; font-size: 15px; }
.secenek .ic { -webkit-flex: 1; flex: 1; min-width: 0; }
.secenek.on { border-color: #1F3A6B; background: #E6ECF6; }
.secenek.on .kutu { background: #1F3A6B; border-color: #1F3A6B; }
.alt-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #F4F5F7; border-top: 1px solid #DDE1E8; padding: 10px 16px; z-index: 5; }
.alt-bar .ic { max-width: 608px; margin: 0 auto; }
.alt-bar .satir2 { display: -webkit-box; display: -webkit-flex; display: flex; }
.alt-bar .satir2 > * { -webkit-flex: 1; flex: 1; min-width: 0; }
.alt-bar .satir2 > * + * { margin-left: 10px; }
/* test */
.soru-kart { background: #fff; border: 1px solid #DDE1E8; border-radius: 12px; padding: 10px; }
.soru-img { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
.iptal { background: #FFF4D6; color: #7A5A00; border-radius: 10px; padding: 10px 12px; font-weight: 700; margin-top: 10px; }
.siklar { display: -webkit-box; display: -webkit-flex; display: flex; margin-bottom: 10px; }
.siklar button { -webkit-flex: 1; flex: 1; height: 52px; border-radius: 12px; border: 2px solid #C2185B; color: #C2185B; font-size: 20px; font-weight: 900; background: #fff; }
.siklar button + button { margin-left: 8px; }
.siklar button.on { background: #1F3A6B; border-color: #1F3A6B; color: #fff; }
.siklar button.dogru { background: #1E8A50; border-color: #1E8A50; color: #fff; }
.siklar button.yanlis { background: #C93535; border-color: #C93535; color: #fff; }
.siklar.pasif button { opacity: .35; }
.noktalar { margin-top: 12px; }
.noktalar button { display: inline-block; width: 36px; height: 36px; border-radius: 8px; border: 1px solid #DDE1E8; background: #fff; font-size: 12px; font-weight: 700; color: #5E6778; margin: 0 6px 6px 0; vertical-align: top; }
.noktalar button.dolu { background: #1F3A6B; color: #fff; border-color: #1F3A6B; }
.noktalar button.d { background: #1E8A50; color: #fff; border-color: #1E8A50; }
.noktalar button.y { background: #C93535; color: #fff; border-color: #C93535; }
.noktalar button.su { border: 2px solid #18233A; }
.anlik { font-weight: 800; margin: 10px 2px 0; }
.anlik.d { color: #1E8A50; } .anlik.y { color: #C93535; }
/* sonuç */
.sonuc { background: #fff; border: 1px solid #DDE1E8; border-radius: 14px; padding: 22px; text-align: center; margin-bottom: 12px; }
.puan { font-size: 60px; font-weight: 800; color: #1F3A6B; line-height: 1; }
.dyb { text-align: center; font-weight: 800; margin-top: 12px; }
.dyb span { display: inline-block; margin: 0 8px; }
.d { color: #1E8A50; } .yl { color: #C93535; } .b { color: #5E6778; }
.filtre { margin: 12px 0; }
.filtre button { display: inline-block; padding: 7px 14px; border-radius: 20px; border: 1px solid #DDE1E8; background: #fff; font-weight: 700; font-size: 13px; margin: 0 6px 6px 0; }
.filtre button.on { background: #1F3A6B; color: #fff; border-color: #1F3A6B; }
.cozum { background: #fff; border: 1px solid #DDE1E8; border-radius: 12px; padding: 10px; margin-bottom: 12px; }
.cozum-ust { font-weight: 800; margin: 2px 2px 8px; }
.cozum-alt { margin: 8px 2px 2px; font-weight: 700; }
.bos { color: #5E6778; text-align: center; margin: 24px 0; }
.anahtar { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: #fff; border: 1px solid #DDE1E8; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.anahtar .ic { -webkit-flex: 1; flex: 1; font-weight: 700; }
.anahtar .dugme { width: 50px; height: 28px; border-radius: 14px; background: #C9CED8; position: relative; }
.anahtar .dugme i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; }
.anahtar.on .dugme { background: #1E8A50; }
.anahtar.on .dugme i { left: 25px; }
#modal { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(16,20,28,.55); z-index: 20; }
#modal .kutu { position: absolute; left: 16px; right: 16px; top: 30%; max-width: 420px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 18px; }
#modal p { margin: 0 0 16px; font-size: 16px; line-height: 1.45; font-weight: 600; }
#toast { position: fixed; left: 16px; right: 16px; bottom: 150px; text-align: center; z-index: 30; display: none; }
#toast span { display: inline-block; background: #18233A; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; }
</style>
</head>
<body>
<div class="kabuk" id="uygulama"></div>
<div id="modal"></div>
<div id="toast"><span></span></div>
<script src="banka.js"></script>
<script>
/* Bilerek ES5 yazıldı: Android 4.4'ün eski WebView'ında da çalışır. */
(function () {
  'use strict';
  var B = window.BANKA;
  var HARF = ['A', 'B', 'C', 'D'];
  var ANAHTAR = 'aciklise:v3';

  var D = { kurulum: false, secim: [], sonuc: {}, yanlis: [], anlik: false };
  try {
    var kayit = localStorage.getItem(ANAHTAR);
    if (kayit) { var o = JSON.parse(kayit); for (var k in o) { if (o.hasOwnProperty(k)) D[k] = o[k]; } }
  } catch (e) {}
  function kaydet() { try { localStorage.setItem(ANAHTAR, JSON.stringify(D)); } catch (e) {} }

  /* ---------- yardımcılar ---------- */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function anahtarlar(o) { var r = []; for (var k in o) { if (o.hasOwnProperty(k)) r.push(k); } return r; }
  function iki(n) { return n < 10 ? '0' + n : String(n); }
  function icinde(dizi, x) { return dizi.indexOf(x) >= 0; }
  function resim(kid, did, no) { return 'soru/' + kid + '/' + did + '_' + iki(no) + '.png'; }
  function kitapAdi(kid) { var k = B.kitaplar[kid]; return k.ad + ' · ' + k.oturum + '. oturum'; }
  function soruSay(did) { var n = 0; B.dersler[did].s.forEach(function (s) { n += s.c.length; }); return n; }
  function karistir(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // Bir soru: { d: ders, k: kitapçık, n: numara, c: doğru şık (-1 iptal) }
  function soruBul(did, kid, n) {
    var s = null; B.dersler[did].s.forEach(function (x) { if (x.k === kid) s = x; });
    return s ? { d: did, k: kid, n: n, c: s.c[n - 1] } : null;
  }
  function soruAnahtar(q) { return q.d + '|' + q.k + '|' + q.n; }
  function anahtardanSoru(a) { var p = a.split('|'); return B.dersler[p[0]] ? soruBul(p[0], p[1], +p[2]) : null; }

  var kok = document.getElementById('uygulama');
  var modalEl = document.getElementById('modal');
  var toastEl = document.getElementById('toast');
  var yigin = [D.kurulum ? { e: 'ana' } : { e: 'giris' }];
  var T = null, toastZ = null, modalFn = null, secimGecici = null;

  function simdiki() { return yigin[yigin.length - 1]; }
  function git(x) { yigin.push(x); ciz(); window.scrollTo(0, 0); }
  function geri() { if (yigin.length > 1) yigin.pop(); ciz(); window.scrollTo(0, 0); }
  function anaya() { yigin = [{ e: 'ana' }]; ciz(); window.scrollTo(0, 0); }

  function toast(m) {
    toastEl.firstChild.textContent = m;
    toastEl.style.display = 'block';
    clearTimeout(toastZ);
    toastZ = setTimeout(function () { toastEl.style.display = 'none'; }, 2400);
  }
  function onay(metin, evetYazi, fn, tehlike) {
    modalFn = fn;
    modalEl.innerHTML = '<div class="kutu"><p>' + esc(metin) + '</p><div class="ikili">' +
      '<button class="btn cizgi" data-m="hayir">Vazgeç</button>' +
      '<button class="btn ' + (tehlike ? 'kirmizi' : 'yesil') + '" data-m="evet">' + esc(evetYazi) + '</button></div></div>';
    modalEl.style.display = 'block';
  }
  function modalKapat() { modalEl.style.display = 'none'; modalEl.innerHTML = ''; modalFn = null; }
  modalEl.addEventListener('click', function (ev) {
    var m = ev.target.getAttribute && ev.target.getAttribute('data-m');
    if (ev.target === modalEl || m === 'hayir') { modalKapat(); return; }
    if (m === 'evet') { var fn = modalFn; modalKapat(); if (fn) fn(); }
  });

  function ust(baslik, alt, sag, geriEylem) {
    return '<div class="ust">' + (geriEylem === 'yok' ? '' : '<button class="geri" data-a="' + (geriEylem || 'geri') + '" aria-label="Geri">‹</button>') +
      '<div class="ust-yazi"><h1>' + esc(baslik) + '</h1>' + (alt ? '<small>' + esc(alt) + '</small>' : '') + '</div>' + (sag || '') + '</div>';
  }
  function dersIlerleme(did) {
    var ders = B.dersler[did], biten = 0, dogru = 0, toplam = 0;
    ders.s.forEach(function (s) { var r = D.sonuc[did + '|' + s.k]; if (r) { biten++; dogru += r.dogru; toplam += r.toplam; } });
    return { biten: biten, sinav: ders.s.length, basari: toplam ? Math.round(dogru / toplam * 100) : null };
  }

  /* ---------- ekranlar ---------- */
  var E = {};

  E.giris = function () {
    return '<div class="etiket" style="margin-top:8px">Açık Lise · Çıkmış Sorular</div><h1 class="dev">Hangi dersleri alıyorsun?</h1>' +
      '<p class="bilgi">' + B.aileler.length + ' ders grubu tek tek gelecek. Her birinde bu dönem aldığın ders kodunu seç, örneğin Coğrafya – 3. Almadığın dersi "Atla" ile geç. ' +
      'Uygulama sadece seçtiğin kodların çıkmış sorularını gösterir.</p>' +
      '<div class="ozet"><div class="oz"><b>' + anahtarlar(B.kitaplar).length + '</b><span>Kitapçık</span></div><div class="oz"><b>' + anahtarlar(B.dersler).length + '</b><span>Ders kodu</span></div>' +
      '<div class="oz"><b>' + toplamSoru() + '</b><span>Çıkmış soru</span></div></div>' +
      '<div class="ara"><button class="btn" data-a="secimBasla">Derslerimi Seç</button></div>' +
      '<button class="baglanti" data-a="girisAtla">Atla, sonra seçerim</button>';
  };
  function toplamSoru() { var n = 0; anahtarlar(B.dersler).forEach(function (d) { n += soruSay(d); }); return n; }

  E.sec = function (x) {
    var aile = B.aileler[x.i], son = x.i === B.aileler.length - 1;
    var h = ust('Ders seçimi', (x.i + 1) + ' / ' + B.aileler.length, '', 'secGeri');
    h += '<div class="cubuk" style="margin:0 0 14px"><i style="width:' + Math.round((x.i + 1) / B.aileler.length * 100) + '%"></i></div>';
    h += '<h1 class="dev" style="font-size:24px">' + esc(aile.ad) + '</h1><p class="bilgi">Bu dönem aldığın kodu işaretle. Birden fazla seçebilirsin. Almıyorsan "Atla"ya bas.</p>';
    aile.d.forEach(function (did) {
      var ders = B.dersler[did], on = icinde(secimGecici, did);
      h += '<div class="secenek tik' + (on ? ' on' : '') + '" data-a="secToggle" data-d="' + did + '"><span class="kutu">' + (on ? '✓' : '') + '</span>' +
        '<div class="ic"><div class="ad">' + esc(ders.ad) + '</div><div class="alt"><span class="kod">' + ders.kod + '</span>' + ders.s.length + ' sınav · ' + soruSay(did) + ' soru</div></div></div>';
    });
    var secili = aile.d.some(function (d) { return icinde(secimGecici, d); });
    h += '<button class="baglanti" data-a="secBitir">Seçimi bitir (' + secimGecici.length + ' ders)</button>';
    h += '<div class="alt-bar"><div class="ic satir2"><button class="btn cizgi" data-a="secAtla">Atla</button>' +
      '<button class="btn' + (secili ? '' : ' kapali') + '" data-a="secIleri">' + (son ? 'Bitir' : 'İleri ›') + '</button></div></div>';
    return h;
  };

  E.ana = function () {
    var h = '<div class="etiket" style="margin-top:8px">Açık Lise · Çıkmış Sorular</div><h1 class="dev">Derslerim</h1>';
    if (!D.secim.length) {
      return h + '<p class="bilgi">Henüz ders seçmedin. Ders kodlarını seçince o derslerin çıkmış soruları burada görünür.</p>' +
        '<button class="btn" data-a="secimBasla">Derslerimi Seç</button>';
    }
    var biten = 0, dogru = 0, toplam = 0;
    D.secim.forEach(function (did) { if (!B.dersler[did]) return; B.dersler[did].s.forEach(function (s) { var r = D.sonuc[did + '|' + s.k]; if (r) { biten++; dogru += r.dogru; toplam += r.toplam; } }); });
    h += '<div class="ozet"><div class="oz"><b>' + D.secim.length + '</b><span>Ders</span></div><div class="oz"><b>' + biten + '</b><span>Sınav çözüldü</span></div>' +
      '<div class="oz"><b>%' + (toplam ? Math.round(dogru / toplam * 100) : 0) + '</b><span>Başarı</span></div></div>';
    var yl = D.yanlis.filter(function (a) { var p = a.split('|'); return icinde(D.secim, p[0]); });
    if (yl.length) h += '<div class="bant tik" data-a="yanlislar"><span class="ic">Yanlış yaptığın ' + yl.length + ' soruyu tekrar et</span><span>›</span></div>';
    D.secim.forEach(function (did) {
      var ders = B.dersler[did]; if (!ders) return;
      var il = dersIlerleme(did);
      h += '<div class="satir tik" data-a="ders" data-d="' + did + '"><div class="ic"><div class="ad">' + esc(ders.ad) + '</div>' +
        '<div class="alt"><span class="kod">' + ders.kod + '</span>' + il.biten + '/' + il.sinav + ' sınav' + (il.basari !== null ? ' · %' + il.basari + ' başarı' : '') + '</div>' +
        '<div class="cubuk"><i style="width:' + Math.round(il.biten / il.sinav * 100) + '%"></i></div></div><span class="sayac">›</span></div>';
    });
    h += '<div class="ara" style="margin-top:14px"><button class="btn cizgi" data-a="secimBasla">Derslerimi Değiştir</button></div>';
    return h;
  };

  E.ders = function (x) {
    var did = x.d, ders = B.dersler[did];
    var h = ust(ders.ad, 'Ders kodu ' + ders.kod + ' · ' + soruSay(did) + ' çıkmış soru');
    h += '<div class="ara"><button class="btn" data-a="karisik" data-d="' + did + '">Karışık Test · 10 soru</button></div>';
    var yl = D.yanlis.filter(function (a) { return a.split('|')[0] === did; });
    if (yl.length) h += '<div class="ara"><button class="btn cizgi" data-a="yanlisCoz" data-d="' + did + '">Bu dersteki yanlışlarım (' + yl.length + ')</button></div>';
    h += '<div class="anahtar tik' + (D.anlik ? ' on' : '') + '" data-a="anlik"><span class="ic">Cevabı hemen göster</span><span class="dugme"><i></i></span></div>';
    h += '<h2>Çıkmış sınavlar</h2>';
    ders.s.forEach(function (s) {
      var r = D.sonuc[did + '|' + s.k], kb = B.kitaplar[s.k];
      var rozet = r ? '<span class="rozet ' + (r.dogru / r.toplam >= 0.5 ? 'iyi' : 'kotu') + '">' + r.dogru + '/' + r.toplam + '</span>' : '<span class="sayac">' + s.c.length + ' soru</span>';
      h += '<div class="satir tik" data-a="sinav" data-d="' + did + '" data-k="' + s.k + '"><div class="ic"><div class="ad">' + esc(kb.ad) + '</div>' +
        '<div class="alt">' + esc(kb.donem) + ' · ' + kb.oturum + '. oturum</div></div>' + rozet + '</div>';
    });
    return h;
  };

  E.test = function () {
    var q = T.sorular[T.sira], ders = B.dersler[q.d], c = T.cevap[T.sira];
    var cevaplandi = c !== undefined, goster = T.anlik && cevaplandi;
    var h = ust(T.ad, (T.sira + 1) + '. soru / ' + T.sorular.length + (T.karisik ? ' · ' + kitapAdi(q.k) : ''), '', 'testCik');
    h += '<div class="soru-kart"><img class="soru-img" src="' + resim(q.k, q.d, q.n) + '" alt="' + (T.sira + 1) + '. soru">' +
      (q.c < 0 ? '<div class="iptal">Bu soru MEB tarafından iptal edildi, puana katılmaz.</div>' : '') + '</div>';
    if (goster && q.c >= 0) {
      h += '<div class="anlik ' + (c === q.c ? 'd">Doğru!' : 'y">Yanlış. Doğru cevap: ' + HARF[q.c]) + '</div>';
    }
    h += '<div class="noktalar">';
    T.sorular.forEach(function (s, i) {
      var cl = '';
      if (T.cevap[i] !== undefined) cl = T.anlik && s.c >= 0 ? (T.cevap[i] === s.c ? 'd' : 'y') : 'dolu';
      h += '<button class="' + cl + (i === T.sira ? ' su' : '') + '" data-a="atla" data-i="' + i + '">' + (i + 1) + '</button>';
    });
    h += '</div>';
    var son = T.sira === T.sorular.length - 1;
    h += '<div class="alt-bar"><div class="ic"><div class="siklar' + (q.c < 0 ? ' pasif' : '') + '">';
    for (var i = 0; i < 4; i++) {
      var cl = '';
      if (goster && q.c >= 0) { if (i === q.c) cl = 'dogru'; else if (i === c) cl = 'yanlis'; }
      else if (c === i) cl = 'on';
      h += '<button class="' + cl + '" data-a="sec" data-i="' + i + '">' + HARF[i] + '</button>';
    }
    h += '</div><div class="satir2"><button class="btn cizgi' + (T.sira === 0 ? ' kapali' : '') + '" data-a="onceki">‹ Önceki</button>' +
      (son ? '<button class="btn yesil" data-a="bitirSor">Bitir</button>' : '<button class="btn" data-a="sonraki">Sonraki ›</button>') + '</div></div></div>';
    return h;
  };

  E.sonuc = function (x) {
    var r = x.r, p = r.toplam ? Math.round(r.dogru / r.toplam * 100) : 0, f = x.f || 'hepsi';
    var h = ust('Sonuç', x.ad);
    h += '<div class="sonuc"><div class="puan">' + p + '</div><div class="b" style="margin-top:6px">' + (p >= 50 ? 'Geçer not! Böyle devam.' : 'Biraz daha çalışalım.') + '</div>' +
      '<div class="dyb"><span class="d">' + r.dogru + ' doğru</span><span class="yl">' + r.yanlis + ' yanlış</span><span class="b">' + r.bos + ' boş</span></div>' +
      (r.iptal ? '<div class="b" style="font-size:13px;margin-top:6px">' + r.iptal + ' iptal soru puana katılmadı</div>' : '') + '</div>';
    h += '<div class="ikili">' + (x.tekrar ? '<button class="btn cizgi" data-a="tekrar">Tekrar Çöz</button>' : '') + '<button class="btn" data-a="anasayfa">Derslerim</button></div>';
    h += '<div class="filtre">';
    [['hepsi', 'Tümü'], ['yanlis', 'Yanlışlar'], ['bos', 'Boşlar']].forEach(function (a) {
      h += '<button class="' + (f === a[0] ? 'on' : '') + '" data-a="filtre" data-f="' + a[0] + '">' + a[1] + '</button>';
    });
    h += '</div>';
    var adet = 0;
    x.sorular.forEach(function (q, i) {
      var c = x.cevap[i];
      if (f === 'yanlis' && !(c !== undefined && q.c >= 0 && c !== q.c)) return;
      if (f === 'bos' && !(c === undefined && q.c >= 0)) return;
      adet++;
      var durum, cl;
      if (q.c < 0) { durum = 'İptal edilen soru'; cl = 'b'; }
      else if (c === undefined) { durum = 'Boş · Doğru cevap: ' + HARF[q.c]; cl = 'b'; }
      else if (c === q.c) { durum = 'Doğru · Cevabın: ' + HARF[c]; cl = 'd'; }
      else { durum = 'Yanlış · Cevabın: ' + HARF[c] + ' · Doğru: ' + HARF[q.c]; cl = 'yl'; }
      h += '<div class="cozum"><div class="cozum-ust b">' + (i + 1) + '. soru · ' + esc(kitapAdi(q.k)) + '</div>' +
        '<img class="soru-img" src="' + resim(q.k, q.d, q.n) + '" alt="">' + '<div class="cozum-alt ' + cl + '">' + durum + '</div></div>';
    });
    if (!adet) h += '<p class="bos">Bu listede soru yok.</p>';
    return h;
  };

  E.yanlislar = function () {
    var say = {};
    D.yanlis.forEach(function (a) { var d = a.split('|')[0]; if (B.dersler[d]) say[d] = (say[d] || 0) + 1; });
    var h = ust('Yanlışlarım', D.yanlis.length + ' soru');
    h += '<p class="bilgi">Yanlış yaptığın sorular burada birikir. Tekrar çözüp doğru yaptığında listeden çıkar.</p>';
    var ds = anahtarlar(say);
    if (!ds.length) h += '<p class="bos">Şu an tekrar edilecek soru yok.</p>';
    ds.sort(function (a, b) { return say[b] - say[a]; }).forEach(function (did) {
      h += '<div class="satir tik" data-a="yanlisCoz" data-d="' + did + '"><div class="ic"><div class="ad">' + esc(B.dersler[did].ad) + '</div>' +
        '<div class="alt"><span class="kod">' + B.dersler[did].kod + '</span></div></div><span class="sayac">' + say[did] + ' soru ›</span></div>';
    });
    if (ds.length) h += '<button class="baglanti sil" data-a="yanlisTemizle">Listeyi temizle</button>';
    return h;
  };

  /* ---------- seçim akışı ---------- */
  function secimBasla() { secimGecici = D.secim.slice(); git({ e: 'sec', i: 0 }); }
  function secimKaydet() {
    D.secim = secimGecici.slice(); D.kurulum = true; kaydet();
    yigin = [{ e: 'ana' }]; ciz(); window.scrollTo(0, 0);
    toast(D.secim.length ? D.secim.length + ' ders seçildi.' : 'Ders seçmedin.');
  }
  function secSonraki() {
    var x = simdiki();
    if (x.i >= B.aileler.length - 1) { secimKaydet(); return; }
    yigin[yigin.length - 1] = { e: 'sec', i: x.i + 1 }; ciz(); window.scrollTo(0, 0);
  }
  function secGeri() {
    var x = simdiki();
    if (x.i > 0) { yigin[yigin.length - 1] = { e: 'sec', i: x.i - 1 }; ciz(); window.scrollTo(0, 0); }
    else { secimGecici = null; geri(); }
  }

  /* ---------- test akışı ---------- */
  function testBaslat(ad, sorular, ayar) {
    T = { ad: ad, sorular: sorular, sira: 0, cevap: {}, anlik: D.anlik, karisik: ayar.karisik, anahtar: ayar.anahtar, yeniden: ayar.yeniden };
    git({ e: 'test' });
  }
  function sinavAc(did, kid) {
    var s = null; B.dersler[did].s.forEach(function (x) { if (x.k === kid) s = x; });
    var sorular = s.c.map(function (c, i) { return { d: did, k: kid, n: i + 1, c: c }; });
    testBaslat(B.dersler[did].ad + ' · ' + B.kitaplar[kid].ad, sorular, { anahtar: did + '|' + kid, yeniden: { tur: 'sinav', d: did, k: kid } });
  }
  function karisikAc(did) {
    var hepsi = [];
    B.dersler[did].s.forEach(function (s) { s.c.forEach(function (c, i) { if (c >= 0) hepsi.push({ d: did, k: s.k, n: i + 1, c: c }); }); });
    testBaslat(B.dersler[did].ad + ' · Karışık', karistir(hepsi).slice(0, 10), { karisik: true, yeniden: { tur: 'karisik', d: did } });
  }
  function yanlisAc(did) {
    var qs = D.yanlis.filter(function (a) { return !did || a.split('|')[0] === did; }).map(anahtardanSoru).filter(function (q) { return q; });
    if (!qs.length) { toast('Tekrar edilecek soru yok.'); return; }
    testBaslat('Yanlışları Tekrar', karistir(qs).slice(0, 30), { karisik: true });
  }
  function testtenCik() { T = null; geri(); }
  function testCikSor() {
    if (!anahtarlar(T.cevap).length) { testtenCik(); return; }
    onay('Testten çıkarsan cevapların kaydedilmez. Çıkmak istiyor musun?', 'Çık', testtenCik, true);
  }
  function bitir() {
    var dogru = 0, yanlis = 0, bos = 0, iptal = 0;
    T.sorular.forEach(function (q, i) {
      var c = T.cevap[i], a = soruAnahtar(q), j = D.yanlis.indexOf(a);
      if (q.c < 0) { iptal++; return; }
      if (c === undefined) { bos++; return; }
      if (c === q.c) { dogru++; if (j >= 0) D.yanlis.splice(j, 1); }
      else { yanlis++; if (j < 0) D.yanlis.push(a); }
    });
    var r = { dogru: dogru, yanlis: yanlis, bos: bos, iptal: iptal, toplam: dogru + yanlis + bos };
    if (T.anahtar) D.sonuc[T.anahtar] = r;
    kaydet();
    var bilgi = { e: 'sonuc', r: r, sorular: T.sorular, cevap: T.cevap, ad: T.ad, tekrar: T.yeniden };
    T = null; yigin.pop(); git(bilgi);
  }

  window.geriTusu = function () {
    if (modalEl.style.display === 'block') { modalKapat(); return true; }
    var x = simdiki();
    if (x.e === 'test') { testCikSor(); return true; }
    if (x.e === 'sec') { secGeri(); return true; }
    if (yigin.length > 1) { geri(); return true; }
    return false;
  };

  /* ---------- dokunmalar ---------- */
  function eylemBul(el) {
    while (el && el !== kok) { if (el.getAttribute && el.getAttribute('data-a')) return el; el = el.parentNode; }
    return null;
  }
  function ac(b, ad) { return b.getAttribute(ad); }
  var eylemler = {
    geri: geri,
    anasayfa: anaya,
    girisAtla: function () { D.kurulum = true; kaydet(); anaya(); },
    secimBasla: secimBasla,
    secGeri: secGeri,
    secToggle: function (b) {
      var d = ac(b, 'data-d'), j = secimGecici.indexOf(d);
      if (j >= 0) secimGecici.splice(j, 1); else secimGecici.push(d);
      ciz();
    },
    secAtla: function () {
      var aile = B.aileler[simdiki().i];
      secimGecici = secimGecici.filter(function (d) { return !icinde(aile.d, d); });
      secSonraki();
    },
    secIleri: function () {
      var aile = B.aileler[simdiki().i];
      if (!aile.d.some(function (d) { return icinde(secimGecici, d); })) { toast('Bir kod seç ya da "Atla"ya bas.'); return; }
      secSonraki();
    },
    secBitir: secimKaydet,
    ders: function (b) { git({ e: 'ders', d: ac(b, 'data-d') }); },
    sinav: function (b) { sinavAc(ac(b, 'data-d'), ac(b, 'data-k')); },
    karisik: function (b) { karisikAc(ac(b, 'data-d')); },
    anlik: function () { D.anlik = !D.anlik; kaydet(); ciz(); },
    yanlislar: function () { git({ e: 'yanlislar' }); },
    yanlisCoz: function (b) { yanlisAc(ac(b, 'data-d')); },
    yanlisTemizle: function () { onay('Yanlışlar listesi tamamen silinsin mi?', 'Sil', function () { D.yanlis = []; kaydet(); ciz(); }, true); },
    testCik: testCikSor,
    sec: function (b) {
      var q = T.sorular[T.sira], i = +ac(b, 'data-i');
      if (q.c < 0) return;
      if (T.anlik && T.cevap[T.sira] !== undefined) return; // anlık modda cevap değişmez
      var secti = T.cevap[T.sira] !== i;
      if (secti) T.cevap[T.sira] = i; else delete T.cevap[T.sira];
      ciz();
      if (secti && !T.anlik && T.sira < T.sorular.length - 1) setTimeout(function () { if (T) { T.sira++; ciz(); window.scrollTo(0, 0); } }, 250);
    },
    atla: function (b) { T.sira = +ac(b, 'data-i'); ciz(); window.scrollTo(0, 0); },
    onceki: function () { if (T.sira > 0) { T.sira--; ciz(); window.scrollTo(0, 0); } },
    sonraki: function () { if (T.sira < T.sorular.length - 1) { T.sira++; ciz(); window.scrollTo(0, 0); } },
    bitirSor: function () {
      var cevapsiz = 0;
      T.sorular.forEach(function (q, i) { if (q.c >= 0 && T.cevap[i] === undefined) cevapsiz++; });
      onay(cevapsiz ? cevapsiz + ' soru boş. Yine de bitirmek istiyor musun?' : 'Testi bitirmek istiyor musun?', 'Bitir', bitir);
    },
    tekrar: function () {
      var y = simdiki().tekrar; yigin.pop();
      if (y.tur === 'sinav') sinavAc(y.d, y.k); else karisikAc(y.d);
    },
    filtre: function (b) { simdiki().f = ac(b, 'data-f'); ciz(); }
  };
  kok.addEventListener('click', function (ev) {
    var b = eylemBul(ev.target);
    if (!b) return;
    var fn = eylemler[ac(b, 'data-a')];
    if (fn) fn(b);
  });

  function ciz() {
    var x = simdiki();
    document.body.className = x.e === 'test' ? 'testte' : (x.e === 'sec' ? 'secimde' : '');
    kok.innerHTML = (E[x.e] || E.ana)(x);
  }
  ciz();
  try { console.log('APP_HAZIR ' + Object.keys(B.dersler).length); } catch (e) {}
})();
</script>
</body>
</html>
